# # Managed by SourceHub。请勿手工修改，插件会在需要时覆盖。
name: SourceHub Fork Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sourcehub-fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream default branch
        env:
          UPSTREAM_REPOSITORY: "shareAI-lab/learn-claude-code"
          UPSTREAM_BRANCH: "main"
          FORK_BRANCH: "main"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
          git push origin "HEAD:${FORK_BRANCH}"
